# CSSI term register — machine-readable source of truth (S1 R11, A3).
# Consumed by LINT-7 (banned-variant check) AND by the S8 term linker
# (scripts/s8/link_terms.py). docs/STYLE.md §4 REFERENCES this file; it never
# duplicates it (single source of truth — no two-copy drift).
#
# ---- Schema (term-register.v2) ------------------------------------------------
#   canonical:        the one sanctioned spelling of the term of art
#   banned_variants:  spellings that FAIL in rendered prose (LINT-7, HIGH).
#                     Matching is case-insensitive and word-bounded; hits inside
#                     direct quotations and code fences are exempt.
#   drift_set:        sibling terms this one must never silently drift into
#                     (judgment — CHECKLIST:D5, not machine-enforced)
#   note:             usage guidance for authors
#
#   --- S8 routing columns (spec S8 R7 four-way routing, D1 every-occurrence) ---
#   route:            page | glossary | citing | skip
#                       page      -> the term has a doctrine-page home; link it
#                       glossary  -> non-vernacular term of art, no page home;
#                                    link [[Common Legal Terms#anchor]]
#                       citing    -> citation-mechanics term; link
#                                    [[Reading and Citing Cases#anchor]]
#                       skip      -> officer-vernacular / plain-English / no clean
#                                    target; NEVER auto-linked in prose. The
#                                    skip-list is instructor-editable register
#                                    DATA (seeded from O1 map §E + spec R7).
#   target:           the INNER wikilink content the linker wraps in [[...]]:
#                       route:page      -> "Doctrine Page"        -> [[Doctrine Page|surface]]
#                       route:glossary  -> "Common Legal Terms#anchor"
#                       route:citing    -> "Reading and Citing Cases#anchor"
#                       route:skip      -> omitted (never linked)
#                     Matching preserves inflection: the matched surface text is
#                     piped as the display ([[Target|surface]]); a bare page
#                     whose surface == target renders [[Target]].
#   match:            optional additional surface forms/inflections to link
#                     (regex-free literal list; case-insensitive + word-bounded).
#                     Banned variants are NEVER listed here (they must be fixed,
#                     not linked in the wrong form).
#   eponym:           true where the term embeds a case name (Terry stop, Miranda
#                     warnings, Katz test, Brady material, Franks hearing, Garrity
#                     warning, Monell claim, Bivens action, Massiah rule, …). The
#                     S8 case-mention linker CONSULTS this flag: an eponym phrase
#                     routes as a TERM (R7), while the bare italic name routes as
#                     a case (R3). Keep the phrase (not the bare name) as canonical.
#   glossary:         (legacy v1 field) retained ONLY where the anchor resolves to
#                     a real ### entry AND the term keeps a glossary binding
#                     (def-only reference anchor for route:skip pc/rs; the live
#                     anchor for route:glossary fruit/totality). Superseded for
#                     ROUTING by route/target; 18 v1 glossary fields that pointed
#                     to anchors the S6/S7 restructure never minted are dropped
#                     here (those terms gained doctrine pages -> route:page). See
#                     the S8-TERMS report for the enumerated drop-list.
#
# DEFINITIONS live ONCE, in the glossary page (Common Legal Terms). The S8 glossary
# audit + LINT-7 rewrite own definition coverage + anchor resolution (a register
# entry whose glossary/citing anchor stops resolving fails CI from S8 onward).
#
# Routes below are SEEDED from the O1 term map (_overhaul/ledger/S7-term-map.md,
# now retired to seed) re-projected onto the CURRENT (restructured) corpus, and
# from spec R7's explicit lists. Rows flagged in the S8-TERMS report await
# orchestrator GO/adjust before --write.

