  - id: seizure.person.when-seized
    label: "When a seizure of the person occurs"
    statement: "A person is 'seized' under the Fourth Amendment in one of two ways: (1) the application of physical force to the body with intent to restrain, or (2) a show of authority to which the person submits. *California v. Hodari D.*, 499 U.S. 621 (1991); *Torres v. Madrid*, 592 U.S. 306 (2021)."
    home_page: "content/seizures/Seizure of the Person.md"
    also_on: []
    status: draft
    seed: false
