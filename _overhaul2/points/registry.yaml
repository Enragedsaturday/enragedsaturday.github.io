  - id: search.curtilage
    label: "Curtilage"
    statement: "Curtilage — 'the area immediately surrounding and associated with the home' — is treated as part of the home itself, so a physical intrusion onto curtilage to gather evidence is a search, presumptively unreasonable without a warrant or exception; everything beyond it is open fields, which receive no Fourth Amendment protection. *Florida v. Jardines*, 569 U.S. 1 (2013); *Oliver v. United States*, 466 U.S. 170 (1984)."
    home_page: "content/searches/Curtilage.md"
    also_on: []
    status: draft
    seed: false
    why: "R6(b) — curtilage-is-part-of-the-home is a distinct black-letter rule; a major training point per the Decision Log."

